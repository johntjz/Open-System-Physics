<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開放系統物理學 // 核心索引</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="terminal-container">
        <!-- Header -->
        <header class="site-header">
            <div class="logo-area">
                <span class="prompt">$</span> <span class="site-title">OPEN_SYSTEM_PHYSICS</span> <span class="cursor">_</span>
            </div>
            <div class="header-right">
                <div class="lang-switch">
                    <a href="../index.html">EN</a> / <span class="active-lang">繁體</span>
                </div>
                <div class="version-tag">v1.0.0 // 動態版</div>
            </div>
        </header>

        <!-- Manifesto -->
        <section class="intro-block">
            <p><strong>系統狀態：</strong> 開放生物系統之巨觀熱力學診斷。繞過還原論噪音、體制熵增與人工幻象。</p>
        </section>

        <!-- Auto-rendered Module Grid -->
        <main class="module-grid" id="module-grid">
            <!-- JavaScript will populate modules here -->
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="footer-left"><span>[去中心化檔案庫 // 抽離雜訊之外]</span></div>
            <div class="footer-right"><span>版本：2026.10</span></div>
        </footer>
    </div>

    <!-- Auto-Render Script -->
    <script>
        fetch('../content/manifest-zh.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('module-grid');
                grid.innerHTML = '';
                
                data.modules.forEach(mod => {
                    let articlesHTML = mod.articles.map(art => `
                        <li><a href="${art.url}">${art.title}</a></li>
                    `).join('');

                    let card = document.createElement('div');
                    card.className = 'module-card';
                    card.innerHTML = `
                        <div class="module-id">${mod.id}</div>
                        <h2>${mod.title}</h2>
                        <p class="module-desc">${mod.desc}</p>
                        <ul class="article-list">${articlesHTML}</ul>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(error => console.error('Error loading manifest:', error));
    </script>
</body>
</html>
